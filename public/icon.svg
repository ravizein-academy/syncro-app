<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee3425" />
      <stop offset="100%" stop-color="#c92215" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ee3425" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#ffffff" stroke="#f1f5f9" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#redGrad)"/>
  <g filter="url(#shadow)">
    <!-- ClickUp style chevron & checkmark silhouette -->
    <path d="M150 250L220 320L360 170" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Modern circular dot badge -->
    <circle cx="360" cy="340" r="28" fill="#ffffff"/>
