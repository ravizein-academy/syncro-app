<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b68ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7b68ee" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  <!-- ClickUp-style glowing badge -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <!-- Logo glyph -->
  <g filter="url(#shadow)">
    <!-- Up chevron -->
    <path d="M 160 300 L 256 200 L 352 300" fill="none" stroke="url(#grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Down dot -->
    <circle cx="256" cy="356" r="24" fill="#06b6d4" />
  </g>
</svg>
