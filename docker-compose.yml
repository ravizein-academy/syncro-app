version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncro-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-production-secret-key-change-this
      - ALLOWED_EMAIL_DOMAIN=itsecacademy.com,itsecasia.com
      - DATABASE_URL=postgresql://syncro_user:syncro_secret@postgres:5432/syncro?sslmode=disable
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_DRIVE_REFRESH_TOKEN=${GOOGLE_DRIVE_REFRESH_TOKEN}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: syncro-postgres
    restart: always
    environment:
      POSTGRES_USER: syncro_user
      POSTGRES_PASSWORD: syncro_secret
      POSTGRES_DB: syncro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncro_user -d syncro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
